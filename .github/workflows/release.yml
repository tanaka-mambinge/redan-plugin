name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: plugins/redan/go.mod

      - name: Test
        working-directory: plugins/redan
        run: go test ./...

      - name: Build release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semver form vX.Y.Z: $TAG" >&2
            exit 1
          fi

          version="${TAG#v}"
          manifest_version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugins/redan/.codex-plugin/plugin.json | head -n 1)"
          if [[ "${manifest_version%%+*}" != "$version" ]]; then
            echo "Tag version $version does not match plugin version $manifest_version" >&2
            exit 1
          fi

          mkdir -p dist
          while IFS=: read -r goos goarch asset; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=$version" -o "dist/$asset" ./plugins/redan/cmd/redan
          done <<'TARGETS'
          linux:amd64:redan_linux_amd64
          linux:arm64:redan_linux_arm64
          darwin:amd64:redan_darwin_amd64
          darwin:arm64:redan_darwin_arm64
          windows:amd64:redan_windows_amd64.exe
          windows:arm64:redan_windows_arm64.exe
          TARGETS

          (cd dist && sha256sum redan_* > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "Redan CLI ${{ github.ref_name }}" --generate-notes
